[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Deploy.s.sol reads the build artifact for the ABI and writes shared/deployments.json.
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read-write", path = "../shared" },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
